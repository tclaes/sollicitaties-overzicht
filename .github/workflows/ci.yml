name: CI

# Bouwt en test elke PR naar main. Tot nu toe draaide er niets op PR-niveau: de
# deploy-workflow triggert pas op push naar main, waardoor een build-brekende
# wijziging pas zichtbaar werd nadat die al gemerged was (zie de gefaalde deploys
# vanaf 24-06-2026).
on:
  pull_request:
    branches:
      - main
    # Vacature-updates (enkel data/firestore-sync-input.json) worden automatisch
    # gemerged door auto-merge-vacature-sync.yml en raken geen code: geen build,
    # tests of e2e nodig. Raakt de PR ook maar één ander bestand, dan draait CI wel.
    paths-ignore:
      - "data/firestore-sync-input.json"
  workflow_dispatch:

# Bij snel opeenvolgende pushes naar dezelfde PR telt alleen de laatste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-en-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vite+ installeren
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true

      - name: Dependencies installeren
        run: vp install

      - name: CSS-lint
        run: vp exec npm run lint:css

      - name: Type- & codecheck (Oxlint + tsgo)
        run: vp check

      - name: Boundary-lint (sheriff)
        run: npm run lint:sheriff

      - name: Tests
        run: vp test

      # Zelfde stap als in deploy.yml, zodat een PR faalt op precies wat ook de
      # deploy zou breken. De VITE_-waarden zijn buildtime-config; zonder deze
      # secrets bouwt Vite een app die naar een leeg Firebase-project wijst.
      - name: Build
        run: vp build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

  # Draait de golden paths (login, solliciteren, niet interessant/herstel) tegen
  # de Firebase-emulators met vaste fixture-data — geen echte Firestore-data of
  # secrets nodig, dus onafhankelijk van build-en-test.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vite+ installeren
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true

      - name: Java installeren (voor de Firestore-emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Dependencies installeren
        run: vp install

      - name: Playwright browser installeren
        run: vp exec npx playwright install --with-deps chromium

      - name: E2E-tests
        run: vp run test:e2e
